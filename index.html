<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFT Studio Pro — Complete Documentation</title>
<meta name="description" content="SFT Studio Pro — Complete Documentation">
<style>
:root{
  --text:#1f2937;
  --muted:#6b7280;
  --accent:#2f6feb;
  --border:#e5e7eb;
  --bg:#ffffff;
  --surface:#f6f8fa;
  --code-bg:#eef1f5;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin:0 auto;padding:0 24px}
.site-header{
  border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,#ffffff,#fbfcfe);
}
.site-header .wrap{
  display:flex;
  align-items:center;
  gap:14px;
  padding-top:18px;
  padding-bottom:18px;
}
.logo{
  width:38px;
  height:38px;
  border-radius:10px;
  flex:0 0 auto;
  background:linear-gradient(135deg,#2f6feb,#7c3aed);
  color:#fff;
  font-weight:700;
  font-size:13px;
  letter-spacing:.5px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.brand{display:flex;flex-direction:column;line-height:1.25}
.brand strong{font-size:17px;letter-spacing:.2px}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
main{padding:44px 0 72px}
article h1{font-size:32px;line-height:1.25;margin:0 0 18px;padding-bottom:14px;border-bottom:1px solid var(--border)}
article h2{font-size:24px;margin:34px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
article h3{font-size:19px;margin:28px 0 10px}
article h4{font-size:16px;margin:24px 0 8px}
article p{margin:0 0 14px}
article a{color:var(--accent);text-decoration:none}
article a:hover{text-decoration:underline}
article code{
  background:var(--code-bg);
  padding:2px 6px;
  border-radius:5px;
  font-size:.9em;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
article pre{
  background:#0d1117;
  color:#e6edf3;
  padding:16px;
  border-radius:8px;
  overflow:auto;
  font-size:14px;
  line-height:1.55;
  margin:0 0 16px;
}
article pre code{background:transparent;padding:0;color:inherit}
article ul,article ol{padding-left:26px;margin:0 0 14px}
article li{margin:4px 0}
article blockquote{
  margin:0 0 14px;
  padding:6px 16px;
  border-left:3px solid var(--border);
  color:var(--muted);
  background:var(--surface);
  border-radius:0 8px 8px 0;
}
article hr{border:0;border-top:1px solid var(--border);margin:28px 0}
article img{max-width:100%;height:auto}
.site-footer{border-top:1px solid var(--border);color:var(--muted);font-size:14px}
.site-footer .wrap{padding-top:20px;padding-bottom:30px}
@media (max-width:600px){
  article h1{font-size:26px}
  main{padding:32px 0 56px}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <div class="logo" aria-hidden="true">SFT</div>
    <div class="brand">
      <strong>SFT Studio Pro</strong>
      <span>Complete Documentation</span>
    </div>
  </div>
</header>
<main>
  <div class="wrap">
    <article id="content">
      <h1>SFT-Studio-Pro-Complete-Documentation</h1>
      <p>Created with Kloak</p>
    </article>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap">SFT Studio Pro — Complete Documentation · Created with Kloak</div>
</footer>
<script>
(function () {
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, "<img alt=\"$1\" src=\"$2\">")
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, "<a href=\"$2\" target=\"_blank\" rel=\"noopener noreferrer\">$1</a>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|\W)\*([^*]+)\*/g, "$1<em>$2</em>");
  }
  function renderMarkdown(md) {
    var lines = md.replace(/\r\n?/g, "\n").split("\n");
    var out = [];
    var inCode = false, code = [], listTag = null, para = [];
    function flushPara() {
      if (para.length) {
        out.push("<p>" + para.map(inline).join(" ") + "</p>");
        para = [];
      }
    }
    function closeList() {
      if (listTag) {
        out.push("</" + listTag + ">");
        listTag = null;
      }
    }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^```/.test(line)) {
        if (inCode) {
          out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
          code = [];
          inCode = false;
        } else {
          flushPara();
          closeList();
          inCode = true;
        }
        continue;
      }
      if (inCode) { code.push(line); continue; }
      if (/^\s*$/.test(line)) { flushPara(); closeList(); continue; }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flushPara();
        closeList();
        out.push("<h" + h[1].length + ">" + inline(h[2]) + "</h" + h[1].length + ">");
        continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
        flushPara();
        var tag = /^\s*\d+[.)]\s+/.test(line) ? "ol" : "ul";
        if (listTag !== tag) { closeList(); out.push("<" + tag + ">"); listTag = tag; }
        out.push("<li>" + inline(line.replace(/^\s*([-*+]|\d+[.)])\s+/, "")) + "</li>");
        continue;
      }
      if (/^>\s?/.test(line)) {
        flushPara();
        closeList();
        out.push("<blockquote>" + inline(line.replace(/^>\s?/, "")) + "</blockquote>");
        continue;
      }
      if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
        flushPara();
        closeList();
        out.push("<hr>");
        continue;
      }
      para.push(line.trim());
    }
    if (inCode) { out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>"); }
    flushPara();
    closeList();
    return out.join("\n");
  }
  fetch("README.md", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) { throw new Error("README unavailable"); }
      return r.text();
    })
    .then(function (text) {
      if (text && text.trim()) {
        document.getElementById("content").innerHTML = renderMarkdown(text);
      }
    })
    .catch(function () {
      /* Keep the embedded documentation content as fallback. */
    });
})();
</script>
</body>
</html>
